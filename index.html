<!DOCTYPE html>
<html lang="zh-CN">
<head>
<link rel="icon" type="image/png" href="https://i.imgs.ovh/2026/10/16/6a456c36b6a70a760ca3a5fb3ea3e74c.png">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>江湖弹笔社2.0</title>
<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:"Noto Serif SC",serif,Microsoft YaHei;
}
:root{
    /* ==========浅色主题(默认)========== */
    --bg-main:#fffdf5;
    --bg-card:#fffef8;
    --bg-modal:#fffef8;
    --text-main:#444;
    --text-title:#b8860b;
    --text-modal:#333;
    --border-gold:#b8860b;
    --border-footer:#e6d7a9;
    --bg-button:#b8860b;
    --bg-button-hover:#966c00;
    --hero-text:#8b5700;
    --mask-bg:rgba(0,0,0,0.75);
    --hero-mask:rgba(255,255,255,0.65);
    --hero-bg:url("https://beeimg.us.ci/temp/6ad392a2b1d49.png");
    --transition-all:background 0.35s ease,color 0.35s ease,border-color 0.35s ease;
    --fade-duration:0.4s ease-out;
}
/* ==========深色主题变量========== */
[data-theme="dark"]{
    --bg-main:#141418;
    --bg-card:#1e1e24;
    --bg-modal:#1e1e24;
    --text-main:#e2e2e2;
    --text-title:#ffcc44;
    --text-modal:#ececec;
    --border-gold:#d4a42c;
    --border-footer:#383222;
    --bg-button:#d4a42c;
    --bg-button-hover:#b3881c;
    --hero-text:#ffdd77;
    --mask-bg:rgba(0,0,0,0.85);
    --hero-mask:rgba(0,0,0,0.55);
    --hero-bg:url("https://beeimg.us.ci/temp/6ad392fad18a8.png");
}
html,body{
    transition:var(--transition-all);
}
body{
    background:var(--bg-main);
    color:var(--text-main);
}
/* 版权勾选弹窗 */
.modal-mask{
    position:fixed;
    top:0;
    left:0;
    width:100vw;
    height:100vh;
    background:rgba(0,0,0,0.85);
    z-index:999;
    display:flex;
    align-items:center;
    justify-content:center;
}
.modal-box{
    width:min(90%,620px);
    background:var(--bg-modal);
    border:2px solid var(--border-gold);
    padding:32px;
    border-radius:12px;
    transition:var(--transition-all);
}
.modal-box h2{
    color:var(--text-title);
    text-align:center;
    margin-bottom:20px;
    letter-spacing:2px;
}
.modal-text{
    line-height:1.8;
    font-size:16px;
    color:var(--text-modal);
    margin-bottom:24px;
    transition:var(--transition-all);
}
.agree-row{
    display:flex;
    align-items:center;
    gap:10px;
    margin-bottom:20px;
}
#agreeCheck{
    width:18px;height:18px;
}
#enterBtn{
    width:100%;
    padding:14px;
    background:var(--bg-button);
    color:#fff;
    border:none;
    border-radius:8px;
    font-size:17px;
    font-weight:bold;
    cursor:pointer;
    transition:var(--transition-all);
}
#enterBtn:disabled{
    background:#d4c288;
    color:#666;
    cursor:not-allowed;
}
.main-site{
    display:none;
    min-height:100vh;
    flex-direction:column;
}
/* 页面容器，淡入淡出 */
.page-wrap{
    position:relative;
    overflow:hidden;
    flex:1;
}
.home-page,.sub-page{
    position:absolute;
    top:0;
    left:0;
    width:100%;
    min-height:100%;
    opacity:0;
    pointer-events:none;
    transition:opacity var(--fade-duration);
}
.page-active{
    opacity:1;
    pointer-events:auto;
}
/* 首页主页界面 */
.home-page{
    background: linear-gradient(var(--hero-mask),var(--hero-mask)), var(--hero-bg);
    background-size:cover;
    background-position:center;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    color:var(--hero-text);
    text-align:center;
    padding:20px;
    gap:32px;
    transition:var(--transition-all), opacity var(--fade-duration);
}
.home-page h1{
    font-size:52px;
    letter-spacing:4px;
}
.home-buttons{
    display:flex;
    gap:20px;
    flex-wrap:wrap;
    justify-content:center;
}
.page-btn{
    padding:14px 32px;
    background:var(--bg-button);
    color:#ffffff;
    border:none;
    border-radius:8px;
    font-size:18px;
    cursor:pointer;
    transition:0.2s;
}
.page-btn:hover{
    background:var(--bg-button-hover);
    transform: translateY(-3px);
}
/* 主题切换按钮 */
.theme-toggle-btn{
    margin-top:12px;
    padding:10px 26px;
    background:transparent;
    color:var(--hero-text);
    border:2px solid var(--border-gold);
    border-radius:8px;
    font-size:16px;
    cursor:pointer;
    transition:0.25s;
}
.theme-toggle-btn:hover{
    background:var(--bg-button);
    color:#fff;
}
/* 子页面样式（点击按钮后进入的独立界面） */
.sub-page{
    background:var(--bg-main);
    padding:40px 20px;
    transition:var(--transition-all), opacity var(--fade-duration);
    overflow-y:auto;
}
.back-btn{
    margin-bottom:30px;
    padding:10px 24px;
    background:var(--bg-button);
    color:#fff;
    border:none;
    border-radius:8px;
    cursor:pointer;
    font-size:16px;
    transition:var(--transition-all);
}
.container{
    max-width:1200px;
    margin:0 auto;
}
.section-title{
    color:var(--text-title);
    font-size:28px;
    margin-bottom:20px;
    border-left:4px solid var(--border-gold);
    padding-left:12px;
    transition:var(--transition-all);
}
.card-grid{
    display:grid;
    grid-template-columns: repeat(auto-fill, minmax(260px,1fr));
    gap:24px;
}
.event-card{
    background:var(--bg-card);
    border:2px solid var(--border-gold);
    border-radius:12px;
    padding:24px;
    cursor:pointer;
    transition:0.25s ease;
    position:relative;
}
.event-card:hover{
    transform: translateY(-6px);
    box-shadow:0 8px 20px rgba(184,134,11,0.25);
    background:#fff8e0;
}
[data-theme="dark"] .event-card:hover{
    background:#2a2820;
}
.event-card h3{
    color:var(--text-title);
    margin-bottom:10px;
    margin-top:8px;
    font-size:20px;
    transition:var(--transition-all);
}
.event-card p{
    color:var(--text-main);
    line-height:1.6;
    transition:var(--transition-all);
}
.countdown-text{
    font-size:14px;
    margin-top:8px;
    color:var(--text-title);
    font-weight:bold;
}
/* ==========卡片右上角比赛状态标签========== */
.event-status{
    position: absolute;
    top: 12px;
    right: 12px;
    padding: 4px 12px;
    border-radius: 20px;
    font-size:13px;
    font-weight:bold;
    color:#fff;
    white-space:nowrap;
}
.status-soon{background:#f0ad4e;}    /*未开始-橙色*/
.status-live{background:#51b44b;}   /*进行中-绿色*/
.status-delay{background:#ff7f50;} /*推迟-橙红*/
.status-end{background:#6c757d;}    /*已结束-灰色*/
/* 卡片弹窗 */
.popup-mask{
    position:fixed;
    top:0;
    left:0;
    width:100vw;
    height:100vh;
    background:var(--mask-bg);
    z-index:998;
    display:none;
    align-items:center;
    justify-content:center;
}
.popup-box{
    width:min(90%,580px);
    background:var(--bg-modal);
    border:2px solid var(--border-gold);
    border-radius:12px;
    padding:32px;
    transition:var(--transition-all);
}
.popup-box h2{
    color:var(--text-title);
    margin-bottom:16px;
    transition:var(--transition-all);
}
.popup-time-info{
    margin-bottom:14px;
    font-size:15px;
    color:var(--text-title);
}
.popup-box p{
    color:var(--text-modal);
    font-size:17px;
    line-height:1.8;
    transition:var(--transition-all);
}
.close-btn{
    margin-top:24px;
    width:100%;
    padding:12px;
    background:var(--bg-button);
    color:#fff;
    border:none;
    border-radius:8px;
    font-weight:bold;
    cursor:pointer;
    font-size:16px;
    transition:var(--transition-all);
}
/* 全局底部版权 */
footer{
    text-align:center;
    padding:30px;
    color:#777;
    border-top:1px solid var(--border-footer);
    width:100%;
    transition:var(--transition-all);
}
</style>
</head>
<body>
<!-- 版权勾选弹窗 -->
<div class="modal-mask" id="modal">
    <div class="modal-box">
        <h2>【版权与赛事须知】</h2>
        <div class="modal-text">
            本班通用弹笔规则及游戏本身经过我们的流入及改造而流行，拥有江湖游戏版权。此后一切关于本游戏的赛事需要向我们进行申请。如果发现私下进行比赛组织或盈利性推销，将被拉入黑名单。
        </div>
        <div class="agree-row">
            <input type="checkbox" id="agreeCheck">
            <label for="agreeCheck">我已阅读并同意以上版权条款</label>
        </div>
        <button id="enterBtn" disabled>进入江湖弹笔社官网</button>
    </div>
</div>
<div class="main-site" id="main">
    <div class="page-wrap">
        <!-- 首页界面 -->
        <div class="home-page page-active" id="home">
            <h1>江湖弹笔社</h1>
            <div class="home-buttons">
                <button class="page-btn" data-target="officialMatch">官方赛事</button>
                <button class="page-btn" data-target="authMatch">授权赛事</button>
                <button class="page-btn" data-target="activity">活动赛事</button>
                <button class="page-btn" data-target="notice">公告</button>
            </div>
            <!-- ✅主题切换按钮，在4个按钮下方 -->
            <button class="theme-toggle-btn" id="themeToggle">切换深色模式</button>
        </div>
        <!-- 【独立界面】官方赛事 -->
        <div class="sub-page" id="officialMatch">
            <div class="container">
                <button class="back-btn">← 返回主页</button>
                <h2 class="section-title">官方赛事</h2>
                <div class="card-grid" id="grid-officialMatch"></div>
            </div>
        </div>
        <!-- 【独立界面】授权赛事 -->
        <div class="sub-page" id="authMatch">
            <div class="container">
                <button class="back-btn">← 返回主页</button>
                <h2 class="section-title">授权赛事</h2>
                <div class="card-grid" id="grid-authMatch"></div>
            </div>
        </div>
        <!-- 【独立界面】活动赛事 -->
        <div class="sub-page" id="activity">
            <div class="container">
                <button class="back-btn">← 返回主页</button>
                <h2 class="section-title">活动赛事</h2>
                <div class="card-grid" id="grid-activity"></div>
            </div>
        </div>
        <!-- 【独立界面】公告 -->
        <div class="sub-page" id="notice">
            <div class="container">
                <button class="back-btn">← 返回主页</button>
                <h2 class="section-title">公告</h2>
                <div class="card-grid" id="grid-notice"></div>
            </div>
        </div>
    </div>
    <!-- 全局底部版权 -->
    <footer>© 江湖弹笔社 版权所有——Steven编写</footer>
</div>
<!-- 卡片弹窗 -->
<div class="popup-mask" id="popupMask">
    <div class="popup-box">
        <h2 id="popTitle"></h2>
        <div class="popup-time-info" id="popTimeInfo"></div>
        <p id="popDesc"></p>
        <button class="close-btn" id="popClose">关闭</button>
    </div>
</div>
<script>
// ======================【卡片添加区，在这里新增卡片！】======================
// 格式：
// {
//    target:"板块id",
//    title:"标题",
//    short:"简介",
//    desc:"弹窗详情",
//    startTime:"2026-10-25 10:00", //开始时间，可选
//    endTime:"2026-10-28 18:00",   //结束时间，可选
//    status:"未开始 / 进行中 / 推迟 / 已结束"  //填了就优先手动；不填自动根据startTime、endTime算
// }
const cardList = [
    // 官方赛事
    {
        target:"officialMatch",
        title:"“我擂个斗”S1",
        short:"决赛时间：下周一",
        desc:"决赛时间：下周一",
	startTime:"2026-10-19 00:00:00", 
	endTime:"2026-10-20 00:00:00",
    },
    //授权赛事
    {
        target:"authMatch",
        title:"马良杯",
        short:"神笔马良！",
        desc:"等待说明。。。",
	startTime:"2026-10-23 16:50:30", 
	endTime:"2026-10-23 16:51:00",
    },
    {
        target:"authMatch",
        title:"刘峻玮峻发杯",
        short:"（发杯是什么",
        desc:"所以发杯到底是啥啊？",
        status:"推迟"
        //startTime:"2026-10-28 14:00",
        //endTime:"2026-11-02 20:00"
        //不写status，自动根据时间计算状态
    },
    //活动赛事
    {
        target:"activity",
        title:"二周年庆典",
        short:"时间：下周二",
        desc:"",
        status:"已结束"
    },
    {
        target:"activity",
        title:"test",
        short:"1",
        desc:"2",
	    startTime:"2026-10-22 16:50:30", 
	    endTime:"2026-10-22 16:51:00",
    },
    //公告
    {
        target:"notice",
        title:"江湖公司-公告1",
        short:"点击查看详情👆",
        desc:"热烈庆祝江湖弹笔社3.0版本发布！"
        //不写status，卡片就不会显示状态标签
    }
];
// =========================================================================

/**
 * 工具函数：精确到秒倒计时文本
 */
function getCountdownText(startTs, endTs){
    const now = Date.now();
    if(!startTs && !endTs) return "";

    if(now < startTs){
        const diff = startTs - now;
        const d = Math.floor(diff/(1000*60*60*24));
        const h = Math.floor((diff%(1000*60*60*24))/(1000*60*60));
        const m = Math.floor((diff%(1000*60*60))/(1000*60));
        const s = Math.floor((diff%(1000*60))/1000);
        return `距离开始：${d}天${h}时${m}分${s}秒`;
    }else if(now >= startTs && now <= endTs){
        const diff = endTs - now;
        const d = Math.floor(diff/(1000*60*60*24));
        const h = Math.floor((diff%(1000*60*60*24))/(1000*60*60));
        const m = Math.floor((diff%(1000*60*60))/(1000*60));
        const s = Math.floor((diff%(1000*60))/1000);
        return `距离结束：${d}天${h}时${m}分${s}秒`;
    }else{
        return "赛事已结束";
    }
}

/**
 * 自动计算状态：没有手动status时，依靠startTime、endTime
 */
function autoGetStatus(startTimeStr, endTimeStr){
    if(!startTimeStr || !endTimeStr) return null;
    const now = Date.now();
    const startTs = new Date(startTimeStr).getTime();
    const endTs = new Date(endTimeStr).getTime();
    if(now < startTs) return "未开始";
    if(now >= startTs && now <= endTs) return "进行中";
    if(now > endTs) return "已结束";
    return null;
}

// 生成状态标签html
function buildStatusHtml(statusText){
    if(!statusText) return "";
    let cls = "";
    switch(statusText){
        case "未开始": cls="status-soon";break;
        case "进行中": cls="status-live";break;
        case "推迟": cls="status-delay";break;
        case "已结束": cls="status-end";break;
    }
    return `<span class="event-status ${cls}">${statusText}</span>`;
}

// 自动渲染所有卡片，DOM只创建一次
function renderCards(){
    cardList.forEach(item=>{
        const grid = document.getElementById("grid-"+item.target);
        const cardDiv = document.createElement("div");
        cardDiv.className = "event-card";

        cardDiv.dataset.title = item.title;
        cardDiv.dataset.desc = item.desc || "暂无详细介绍";
        cardDiv.dataset.startTime = item.startTime || "";
        cardDiv.dataset.endTime = item.endTime || "";
        cardDiv.dataset.manualStatus = item.status ?? "";

        //内部子元素容器，方便后续更新
        cardDiv.innerHTML = `
            <span class="event-status"></span>
            <h3>${item.title}</h3>
            <p>${item.short}</p>
            <div class="countdown-text"></div>
        `;
        grid.appendChild(cardDiv);
    })
    updateAllCountdown();
}

// 每秒更新全部卡片倒计时与状态（不重建DOM，只改内容）
function updateAllCountdown(){
    document.querySelectorAll(".event-card").forEach(card=>{
        const manualStatus = card.dataset.manualStatus;
        const st = card.dataset.startTime;
        const et = card.dataset.endTime;

        let useStatus = manualStatus || autoGetStatus(st,et);

        const statusSpan = card.querySelector(".event-status");
        if(useStatus){
            let cls = "";
            switch(useStatus){
                case "未开始": cls="status-soon";break;
                case "进行中": cls="status-live";break;
                case "推迟": cls="status-delay";break;
                case "已结束": cls="status-end";break;
            }
            statusSpan.className = "event-status " + cls;
            statusSpan.textContent = useStatus;
        }else{
            statusSpan.textContent = "";
            statusSpan.className = "event-status";
        }

        const startTs = st ? new Date(st).getTime() : null;
        const endTs = et ? new Date(et).getTime() : null;
        const cdTextDom = card.querySelector(".countdown-text");
        if(startTs && endTs){
            cdTextDom.textContent = getCountdownText(startTs, endTs);
        }else{
            cdTextDom.textContent = "";
        }
    })
}

renderCards();
// 定时器：1000毫秒刷新一次倒计时
setInterval(updateAllCountdown,1000);

// ============深色浅色模式逻辑 本地存储记住选择============
const themeToggle = document.getElementById("themeToggle");
const htmlRoot = document.documentElement;
//读取本地保存
let currentTheme = localStorage.getItem("theme") || "light";
applyTheme(currentTheme);
function applyTheme(mode){
    if(mode === "dark"){
        htmlRoot.setAttribute("data-theme","dark");
        themeToggle.innerText = "切换浅色模式";
    }else{
        htmlRoot.removeAttribute("data-theme");
        themeToggle.innerText = "切换深色模式";
    }
    localStorage.setItem("theme",mode);
}
themeToggle.onclick = ()=>{
    const newMode = htmlRoot.hasAttribute('data-theme') ? "light":"dark";
    applyTheme(newMode);
}
// ======================================================
const modal = document.getElementById("modal");
const main = document.getElementById("main");
const agreeCheck = document.getElementById("agreeCheck");
const enterBtn = document.getElementById("enterBtn");
const homePage = document.getElementById("home");
const subPages = document.querySelectorAll(".sub-page");
//获取全部页面
const allPages = [homePage, ...subPages];
//页面切换工具（渐变）
function switchPage(targetId){
    allPages.forEach(p=>{
        p.classList.remove("page-active");
    })
    document.getElementById(targetId).classList.add("page-active");
}
agreeCheck.onchange = ()=>{
    enterBtn.disabled = !agreeCheck.checked;
}
enterBtn.onclick = ()=>{
    modal.style.display = "none";
    main.style.display = "flex";
    switchPage("home");
}
// 点击主页按钮
document.querySelectorAll(".page-btn").forEach(btn=>{
    btn.onclick = function(){
        const targetId = this.dataset.target;
        switchPage(targetId);
    }
})
// 返回主页按钮
document.querySelectorAll(".back-btn").forEach(btn=>{
    btn.onclick = function(){
        switchPage("home");
    }
})
//卡片弹窗
const mask = document.getElementById("popupMask");
const popTitle = document.getElementById("popTitle");
const popDesc = document.getElementById("popDesc");
const popTimeInfo = document.getElementById("popTimeInfo");
const closeBtn = document.getElementById("popClose");
document.querySelectorAll(".event-card").forEach(card=>{
    card.onclick = function(){
        popTitle.innerText = this.dataset.title;
        popDesc.innerText = this.dataset.desc;
        const s = this.dataset.startTime;
        const e = this.dataset.endTime;
        if(s || e){
            popTimeInfo.innerText = `开始：${s||"无"}　结束：${e||"无"}`;
        }else{
            popTimeInfo.innerText = "";
        }
        mask.style.display = "flex";
    }
})
closeBtn.onclick = ()=> mask.style.display = "none";
mask.onclick = function(e){
    if(e.target === mask) mask.style.display = "none";
}
</script>
</body>
</html>
